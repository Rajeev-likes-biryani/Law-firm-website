    <button class="js-heads" onclick="moveDecider('heads')">

      tails

    <p class="js-movePresenter"></p>


    <script>
   
   function moveDecider(choice) {
    if (choice === 'heads') {
      document.querySelector('.js-movePresenter')

    } else if (choice === 'tails') {
      document.querySelector('.js-movePresenter')
        .innerHTML = 'You chose: tails';
    }
   }
