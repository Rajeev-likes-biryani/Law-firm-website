<!DOCTYPE html>
<html>
  <head>
    <title >DOM-practice-2</title>
  </head>
  <body>
    <input placeholder="enter your name" class="js-name-holder" onkeydown="keyDown(event)">
    
    <button onclick="
    nameGiver()
    ">submit</button>

    <p class="js-name-display"></p>
    <script>
     function keyDown (event) {
      if(event.key === 'Enter') {
        nameGiver()
      }
     }

      function nameGiver () {
       const inputElem = document.querySelector('.js-name-holder');
       const paraElem = document.querySelector('.js-name-display');
       paraElem.innerHTML = `your name is: ${inputElem.value}`
      }
    </script>
  </body>
</html>
