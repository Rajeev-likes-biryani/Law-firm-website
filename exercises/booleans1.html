<!DOCTYPE html>
<html>
  <head>
    <title>Booleans Practice</title>
  </head>
  <body>



    <script> 
    const hour = 10;

    const name = 'Rajeev';

    if (hour>= 6 && hour<= 12 ) {
      console.log(`Good morning ${name}`);
    } else if (hour >= 12 && hour <= 18) {
      console.log(`Good afternoon ${name}`);
    } else {
      console.log(`Good Night ${name}`);
    }
     
    

    </script>
  </body>
</html>
