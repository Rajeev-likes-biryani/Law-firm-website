<!DOCTYPE html>
<html>
  <head>
    <title>
      functions practice1
    </title>
  </head>
  <body>
    <script>
      function greet (name) {
        if (!name) {
          console.log('Hi there');
        } else {
          console.log(`Hello ${name}`);
        }
      }

      greet ('Rajeev');

      greet('Grandpa');
      
      greet();
    </script>
  </body>
</html>
