<!DOCTYPE html>
<html>
  <head>
    <title>calculator</title>
  </head>
  
  <body>
    <p>
    <button onclick="
      updateCalculation ('1');
      ">1</button> 

    <button onclick="
      updateCalculation ('2');
    ">2</button> 

    <button onclick="
      updateCalculation ('3');
    ">3</button>

    <button onclick="
      updateCalculation (' + ');
    ">
      + 
    </button> 
    </p>

    <p>
    <button onclick="
      updateCalculation ('4');
    ">4</button>

    <button onclick="
      updateCalculation ('5');
    ">5</button>
  
    <button onclick="
      updateCalculation ('6');
    ">6</button>

    <button onclick="
      updateCalculation (' - ');
    ">
      - 
    </button>
  </p>

  <p>  
    <button onclick="
      updateCalculation ('7');
    ">7</button>
    
    <button onclick="
      updateCalculation ('8');
    ">8</button>

    <button onclick="
      updateCalculation ('9');
    ">9</button>

    <button onclick="
      updateCalculation (' * ');
    ">
      *
    </button>
 </p>

 <p>
    <button onclick="
      updateCalculation ('0');
    ">0</button>

    <button onclick="
      updateCalculation ('.');
    ">.</button>

    <button onclick="
      updateCalculation (' / '); 
    ">
      / 
    </button>

    <button onclick="
    calculation = eval(calculation);
    console.log(calculation);
    localStorage.setItem('numbers', JSON.stringify(calculation));
    
    ">
      =
    </button>
  </p>

    <button onclick="
    calculation= ''; 
    console.log(`Cleared. ${calculation}`);
    localStorage.setItem('numbers', JSON.stringify(calculation));
  
    ">Clear</button>

  

    <script>
     let calculation = JSON.parse(localStorage.getItem('numbers')) || '';
      function updateCalculation(value) {
        calculation += value;
        console.log(calculation);
        localStorage.setItem('numbers', JSON.stringify(calculation));
      }

    </script>
  </body>
</html>
