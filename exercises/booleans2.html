<!DOCTYPE html>
<html>
  <head>
    <title>Booleans Practice</title>
  </head>
  <body>
    <script>
      const age = 66;

      const isHoliday = false;

      if ((age <= 6 || age >= 65) && !isHoliday) {
        console.log('You are eligible for a discount');
      } else if ((age <= 6 || age >= 65) && isHoliday) {
        console.log('discount only available on non-holidays');
      } else {
        console.log('You are not eligible for a discount');
      }

    </script>
  </body>
</html>
