<!DOCTYPE html>
<html>
  <head>
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="../css-files-for-videolessons/rockpaperscissors.css">
  </head>
    <body>

      <p class="heading">Rock Paper Scissors</p>

      <button class= image-holder onclick="
      playerMove('rock')
      "><img class="image" src="../pics/rock-emoji.png"> </button>

      <button class= image-holder onclick="
       playerMove('paper')
      "><img  class="image" src ="../pics/paper-emoji.png"> </button>

      <button class= image-holder onclick="
      playerMove('scissors');
      "><img class="image" src="../pics/scissors-emoji.png"></button>

      <p class="js-results"></p>

      <p class="js-computer-moves" style="
      margin-bottom: 50px;
      "> </p>

      <p class="js-Score"></p>

      <button class = "Reset" onclick="
      score.wins = 0;
      score.Losses = 0;
      score.Ties = 0;
      localStorage.removeItem('score');
      scoreUpdater();
      ">Reset score</button>

      <script src = "../scripts/rock-paper-scissors.js">
      </script>
    </body>
</html>
