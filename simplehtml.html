<!DOCTYPE html>
<html>
  <head>
    <title>simple html</title>
    <style>
      .cart{
        background-color: yellow;
        padding: 5px 20px;
        cursor: pointer;
      }
      .buy{
        background-color: orange;
        padding: 5px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>
      Adults plain cotton T-shirt
    </p>
    <p>
      Price: 7.99$
    </p>
    <button class="cart" onclick="
      alert('Added');">
      Add to cart
    </button>
    <button class="buy" onclick="
      console.log('Loading...');
      alert('Purchased');
    ">
      Buy now
    </button>
  </body>
</html>
